<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>

<div class="container mt-4" style="max-width: 600px;">
    <h1 th:text="${customer.id == null} ? 'Nuevo cliente' : 'Editar cliente'"></h1>

    <form method="post" th:action="@{/customer/save}" th:object="${customer}">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de documento</label>
            <select class="form-select" th:field="*{documentType}">
                <option value="">Seleccione</option>
                <option value="DNI">DNI</option>
                <option value="RUC">RUC</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}"></div>
            <div class="text-danger" th:if="${errorTipo != null}" th:text="${errorTipo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Número de documento</label>
            <input type="text" class="form-control" th:field="*{document}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('document')}" th:errors="*{document}"></div>
            <div class="text-danger" th:if="${errorDocumento != null}" th:text="${errorDocumento}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/customer}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
