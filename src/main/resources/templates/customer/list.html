<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>

<div class="container mt-4">
    <h1>Clientes</h1>
    <a th:href="@{/customer/new}" class="btn btn-success mb-3">Nuevo cliente</a>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo de documento</th>
            <th>Documento</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customerList}">
            <td th:text="${customer.id}"></td>
            <td th:text="${customer.name}"></td>
            <td th:text="${customer.documentType}"></td>
            <td th:text="${customer.document}"></td>
            <td>
                <a th:href="@{/customer/edit(id=${customer.id})}" class="btn btn-sm btn-primary">Editar</a>
                <a th:href="@{/customer/delete(id=${customer.id})}" class="btn btn-sm btn-danger">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
