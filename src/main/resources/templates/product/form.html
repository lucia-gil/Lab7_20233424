<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>

<div class="container mt-4" style="max-width: 600px;">
    <h1 th:text="${product.id == null} ? 'Nuevo producto' : 'Editar producto'"></h1>

    <form method="post" th:action="@{/product/save}" th:object="${product}">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            <div class="text-danger" th:if="${errorNombre != null}" th:text="${errorNombre}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="text" class="form-control" th:field="*{price}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock</label>
            <input type="text" class="form-control" th:field="*{stock}"/>
            <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/product}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
